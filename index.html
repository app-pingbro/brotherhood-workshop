<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>BROTHERHOOD WORKSHOP MANAGEMENT</title>
<meta name="description" content="Laporan produksi &amp; keuangan bulanan untuk PINGBRO, SUNRISE, dan BROTHERHOOD." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%23101010%22/><text x=%2212%22 y=%2216.5%22 font-size=%2211%22 text-anchor=%22middle%22 fill=%22%23C6EF4E%22 font-family=%22sans-serif%22 font-weight=%22800%22>BW</text></svg>" />
<link rel="stylesheet" href="css/theme.css" />
<link rel="stylesheet" href="css/style.css" />
<script>
  // Apply saved theme before first paint to avoid a flash-of-wrong-theme.
  // Default is LIGHT unless the user explicitly chose dark before.
  (function () {
    try {
      var t = localStorage.getItem('bw_theme');
      if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      else document.documentElement.setAttribute('data-theme', 'light');
    } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
  })();
</script>
<style>
  /* Splash awal: logo Brotherhood (dari cache perangkat) + nama, sampai layar pertama siap. */
  #boot-splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: var(--color-bg); transition: opacity .28s ease; }
  #boot-splash.is-out { opacity: 0; pointer-events: none; }
  .boot-splash__mark { width: 88px; height: 88px; border-radius: 22px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--color-primary); color: var(--color-on-primary); font-family: var(--font-display); font-weight: 800; font-size: 30px; }
  .boot-splash__mark.has-logo { background: #fff; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .boot-splash__mark img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .boot-splash__name { font-family: var(--font-display); font-weight: 800; font-size: 14px; letter-spacing: .08em; text-align: center; max-width: 280px; line-height: 1.35; color: var(--color-text-high); text-wrap: balance; padding: 0 20px; }
  .boot-splash__bar { width: 120px; height: 3px; border-radius: 3px; background: var(--color-border); overflow: hidden; }
  .boot-splash__bar::after { content: ''; display: block; width: 40%; height: 100%; background: var(--color-primary); border-radius: 3px; animation: boot-slide 1.1s ease-in-out infinite; }
  @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
  @media (prefers-reduced-motion: reduce) { .boot-splash__bar::after { animation: none; width: 100%; opacity: .5; } }
</style>
</head>
<body>
  <div id="boot-splash" aria-hidden="true">
    <div class="boot-splash__mark" id="boot-splash-mark">BW</div>
    <div class="boot-splash__name">BROTHERHOOD WORKSHOP MANAGEMENT</div>
    <div class="boot-splash__bar"></div>
  </div>
  <script>
    // Isi logo splash secepat mungkin dari cache perangkat (logo yang sama dengan header/login/Slip Gaji).
    (function () {
      try {
        var b = JSON.parse(localStorage.getItem('bw_brand_url_v1') || 'null');
        if (!b || !b.url) return;
        var s = JSON.parse(localStorage.getItem('bw_slip_logo_v1') || 'null');
        var src = (s && s.id === b.id && s.dataUrl) ? s.dataUrl : b.url;
        var m = document.getElementById('boot-splash-mark');
        var img = new Image(); img.alt = '';
        img.onload = function () { m.textContent = ''; m.className += ' has-logo'; m.appendChild(img); };
        img.src = src;
      } catch (e) {}
    })();
    // Pengaman: splash tidak pernah menutupi aplikasi lebih dari 10 detik.
    setTimeout(function () { var e = document.getElementById('boot-splash'); if (e) e.className += ' is-out'; }, 10000);
  </script>
  <div id="shell-root"></div>
  <div id="toast-stack" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
